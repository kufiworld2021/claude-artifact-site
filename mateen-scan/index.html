<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B2719">
<title>Mateen Scan</title>
<style>
:root{--wood:#3B2719;--wood2:#6E4B34;--sand:#F3EBDF;--ink:#1E1914;--ok:#1F8A4C;--warn:#B7801A;--bad:#B23A2A;--card:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--sand);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--wood);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:20px;letter-spacing:.06em}
header span{font-size:13px;opacity:.85}
header em{font-style:normal;text-align:right;font-size:11px;letter-spacing:.08em;opacity:.9}
header em strong{display:block;font-size:26px;letter-spacing:0}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px}
#scan{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;border:0;background:var(--wood);color:#fff;font-size:34px;font-weight:800;letter-spacing:.08em;box-shadow:0 10px 30px rgba(59,39,25,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#scan svg{width:64px;height:64px}
#scan:active{transform:scale(.97)}
#last{min-height:22px;font-size:15px;color:var(--wood2);text-align:center}
#queue{font-size:13px;color:var(--warn);text-align:center}
#mode{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.08em;background:#F2C14E;color:#3B2719;border-radius:6px;padding:2px 8px}
#tlog{width:min(100%,380px);display:flex;flex-direction:column;gap:6px}
#tlog .row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
#tlog .txt{display:flex;flex-direction:column;min-width:0}
#tlog b{font-family:ui-monospace,Menlo,monospace}#tlog span{color:var(--wood2);font-size:13px}
#tlog .off{opacity:.55}#tlog .off b{text-decoration:line-through}
#tlog .ub{flex:none;min-height:40px;padding:8px 12px;border:1.5px solid var(--bad);border-radius:8px;background:#fff;color:var(--bad);font-size:13px;font-weight:800;letter-spacing:.05em}
.full{position:fixed;inset:0;z-index:5}
#cam{background:#000}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#cam .frame i{width:min(72vw,300px);aspect-ratio:1;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#cam .tip{position:absolute;left:0;right:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:16px;font-weight:600}
#close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px}
#res{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#fff}
#res.ok{background:var(--ok)}#res.dup{background:var(--warn)}#res.bad{background:var(--bad)}#res.wait{background:var(--wood2)}
#res .big{font-size:46px;font-weight:900;line-height:1}
#res .stage{font-size:26px;font-weight:700}
#res .ord{font-size:20px;font-family:ui-monospace,Menlo,monospace;opacity:.95}
#res .msg{font-size:15px;opacity:.9;max-width:320px}
#res .tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:14px;opacity:.85}
#res .pbtn{margin-top:14px;min-width:220px;padding:18px 26px;border:0;border-radius:16px;background:#fff;color:var(--bad);font-size:22px;font-weight:800;letter-spacing:.06em}
#res.ask{background:var(--wood)}
#res .two{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#res .two .pbtn{min-width:180px}
#res .nbtn{margin-top:14px;min-width:120px;padding:18px 26px;border:2px solid #fff;border-radius:16px;background:transparent;color:#fff;font-size:22px;font-weight:800}
#res .ubig{margin-top:22px;min-width:250px;padding:16px 24px;border:2px solid #fff;border-radius:14px;background:rgba(0,0,0,.12);color:#fff;font-size:18px;font-weight:800;letter-spacing:.05em}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div><b>MATEEN · SCAN</b><br><span id="cyc">Factory floor updates</span><br><span id="mode" hidden>TEST MODE · saved on this phone only</span></div><em><strong id="cnt">0</strong>DONE TODAY</em></header>
<main>
  <button id="scan" type="button" aria-label="Scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>SCAN</button>
  <div id="last"></div>
  <div id="queue"></div>
  <div id="tlog"></div>
</main>
<section id="cam" class="full" hidden><video id="v" playsinline muted></video><div class="frame"><i></i></div><div class="tip">Point at the task QR · 20–30 cm away</div><button id="close" type="button" aria-label="Close">×</button></section>
<section id="res" class="full" hidden></section>
<input type="file" id="pic" accept="image/*" capture="environment" hidden>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
/* the Apps Script web-app URL of the sheet «Mateen Scans · مسح المهام» */
var API='PASTE_WEB_APP_URL_HERE';
var STG={P1:'Tab cutting',P2:'Body cutting',P3:'Back & decor',P4:'Drilling',P5:'Tab balancing',P9:'Base balancing',P8:'Body balancing',P6:'Tab edge banding',PA:'Base edge banding',P7:'Body edge banding',CL:'Long cladding',IK:'IKEA design',LD:'LED in top',AC:'Accessories',K1:'Tab wrapping',K2:'Body boxes',KF:'Box filling',K3:'PKG wrapping',W1:'AWB piece 1',W2:'AWB piece 2',W3:'AWB piece 3',W4:'AWB piece 4',W5:'AWB piece 5',W6:'AWB piece 6'};
var $=function(id){return document.getElementById(id)},stream=null,timer=null,busy=false,back=null,liveFail=false;
/* opened from the Apps Script link: save through google.script.run (no API link needed) */
function gas(){return !!(window.google&&google.script&&google.script.run)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function count(add){var k='cnt.'+today(),n=Math.max(0,+(ls(k)||0)+(add||0));if(add)ls(k,String(n));$('cnt').textContent=n}
function queue(){try{return JSON.parse(ls('queue')||'[]')}catch(e){return []}}
function setQueue(q){ls('queue',JSON.stringify(q));$('queue').textContent=q.length?q.length+' update(s) saved on this phone · sending when online':''}
function parse(t){t=String(t||'').trim().toUpperCase().replace(/\s+/g,'');var m=/^([A-Z0-9-]+)\.([A-Z0-9]{1,3})$/.exec(t);return m?{code:t,no:m[1],st:m[2]}:null}
function beep(ok){try{var a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?1250:330;o.connect(g);g.connect(a.destination);g.gain.value=.18;o.start();o.stop(a.currentTime+(ok?.12:.35))}catch(e){}if(navigator.vibrate)navigator.vibrate(ok?90:[60,60,60])}
function show(c,big,p,msg){var r=$('res');r.className='full '+c;r.hidden=false;
  r.innerHTML='<div class="big"></div><div class="stage"></div><div class="ord"></div><div class="msg"></div><div class="tap">Tap to continue</div>';
  r.querySelector('.big').textContent=big;r.querySelector('.stage').textContent=p&&STG[p.st]?STG[p.st]:(p?p.st:'');r.querySelector('.ord').textContent=p?p.no:'';r.querySelector('.msg').textContent=msg||'';
  clearTimeout(back);if(c!=='wait')back=setTimeout(home,2600)}
function home(){clearTimeout(back);$('res').hidden=true}
function send(p){var dev=(navigator.userAgent||'').slice(0,60);
  if(gas())return new Promise(function(ok,no){google.script.run.withSuccessHandler(ok).withFailureHandler(no).saveScan(p.code,dev)});
  if(API.indexOf('https://')!==0)return Promise.resolve({setup:true});
  return fetch(API,{method:'POST',body:JSON.stringify({code:p.code,device:dev})}).then(function(r){return r.json()})}
/* no bridge link yet (and not opened from Apps Script) → TEST MODE: scans are kept on this phone only */
function testMode(){return !gas()&&API.indexOf('https://')!==0}
function sendUndo(code){var dev=(navigator.userAgent||'').slice(0,60);
  if(gas())return new Promise(function(ok,no){google.script.run.withSuccessHandler(ok).withFailureHandler(no).undoScan(code,dev)});
  if(API.indexOf('https://')!==0)return Promise.resolve({ok:true});
  return fetch(API,{method:'POST',body:JSON.stringify({code:code,device:dev,action:'undo'})}).then(function(r){return r.json()})}
/* this phone's recent scans: {c:code, t:time, s:'ok'|'queued'|'undone'|'undoq', m:'test'|'live'} */
function slog(){try{var L=JSON.parse(ls('scanlog')||'null');if(L)return L;return JSON.parse(ls('testlog')||'[]').map(function(x){return {c:x.c,t:x.t,s:'ok',m:'test'}})}catch(e){return []}}
function setLog(L){ls('scanlog',JSON.stringify(L.slice(0,60)));showLog()}
function active(L,code){for(var i=0;i<L.length;i++)if(L[i].c===code&&(L[i].s==='ok'||L[i].s==='queued'))return i;return -1}
function addLog(code,st){var L=slog();L.unshift({c:code,t:Date.now(),s:st,m:testMode()?'test':'live'});setLog(L)}
function hhmm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function showLog(){var box=$('tlog'),m=testMode()?'test':'live';box.textContent='';
  slog().filter(function(x){return (x.m||'test')===m}).slice(0,6).forEach(function(x){var q=parse(x.c),d=document.createElement('div'),w=document.createElement('div'),a=document.createElement('b'),b=document.createElement('span'),off=x.s==='undone'||x.s==='undoq';
    d.className='row'+(off?' off':'');w.className='txt';a.textContent=q?q.no+' · '+q.st:x.c;
    b.textContent=(q&&STG[q.st]?STG[q.st]+' · ':'')+hhmm(x.t)+(x.s==='undone'?' · UNDONE':x.s==='undoq'?' · undo waiting':x.s==='queued'?' · waiting':'');
    w.appendChild(a);w.appendChild(b);d.appendChild(w);
    if(!off){var u=document.createElement('button');u.type='button';u.className='ub';u.textContent='UNDO';u.setAttribute('data-c',x.c);d.appendChild(u)}
    box.appendChild(d)})}
function lastTxt(p){$('last').textContent='Last: '+p.no+' · '+(STG[p.st]||p.st)}
/* DONE screen with the MISTAKE button (stays 6 s) */
function showDone(p,msg,big,c){show(c||'ok',big||'DONE ✓',p,msg);var r=$('res'),b=document.createElement('button');
  b.type='button';b.id='undo';b.className='ubig';b.textContent='✕ MISTAKE · UNDO';b.setAttribute('data-c',p.code);r.insertBefore(b,r.querySelector('.tap'));
  clearTimeout(back);back=setTimeout(home,6000)}
function handle(raw){var p=parse(raw);if(!p){beep(false);show('bad','WRONG CODE',null,'This is not a Mateen task code.');return}
  var L=slog(),i=active(L,p.code);
  if(testMode()){
    if(i>=0){beep(false);show('dup','ALREADY DONE',p,'Test mode · scanned before on this phone.');return}
    addLog(p.code,'ok');beep(true);count(1);lastTxt(p);showDone(p,'Test mode · saved on this phone only.');return}
  if(i>=0&&L[i].s==='queued'){beep(false);show('dup','ALREADY DONE',p,'Already saved on this phone · waiting for internet.');return}
  show('wait','Saving…',p,'');
  send(p).then(function(j){
    if(j&&j.setup){beep(false);show('bad','NOT SET UP',p,'The bridge link is missing. Ask the office.');return}
    if(j&&j.ok&&!j.dup){beep(true);count(1);addLog(p.code,'ok');lastTxt(p);showDone(p,'Saved on the dashboard.')}
    else if(j&&j.ok&&j.dup){beep(false);show('dup','ALREADY DONE',p,'This task was scanned before.')}
    else{beep(false);show('bad','WRONG CODE',p,'Not accepted ('+(j&&j.err||'error')+').')}
  }).catch(function(){var q=queue();if(q.indexOf(p.code)<0){q.push(p.code);setQueue(q)}beep(true);count(1);addLog(p.code,'queued');lastTxt(p);
    showDone(p,'No internet. It will be sent automatically.','SAVED ON PHONE','dup')})}
/* undo a scan made by mistake: the row is marked «undone» on the sheet (nothing is deleted) */
function askUndo(code){var p=parse(code),r=$('res');clearTimeout(back);r.className='full ask';r.hidden=false;
  r.innerHTML='<div class="big">UNDO?</div><div class="stage"></div><div class="ord"></div><div class="msg">Only if this code was scanned by mistake.</div><div class="two"><button type="button" id="yes" class="pbtn">YES, UNDO</button><button type="button" id="no" class="nbtn">NO</button></div>';
  r.querySelector('.stage').textContent=p&&STG[p.st]?STG[p.st]:(p?p.st:'');r.querySelector('.ord').textContent=p?p.no:code;r.querySelector('#yes').setAttribute('data-c',code)}
function doUndo(code){var p=parse(code),L=slog(),i=active(L,code);if(i<0){home();showLog();return}
  function fin(st,big,msg){var M=slog(),k=active(M,code);if(k>=0){M[k].s=st;setLog(M)}count(-1);if(p)$('last').textContent='Undone: '+p.no+' · '+(STG[p.st]||p.st);beep(false);show('dup',big,p,msg)}
  if(testMode()){fin('undone','UNDONE ↩','Removed. Now scan the right code.');return}
  if(L[i].s==='queued'){setQueue(queue().filter(function(x){return x!==code}));fin('undone','UNDONE ↩','Removed. Now scan the right code.');return}
  show('wait','Undoing…',p,'');
  sendUndo(code).then(function(j){if(j&&j.ok)fin('undone','UNDONE ↩','Removed from the dashboard. Now scan the right code.');else{beep(false);show('bad','NOT UNDONE',p,'Try again ('+(j&&j.err||'error')+').')}})
    .catch(function(){var q=queue();if(q.indexOf('!'+code)<0){q.push('!'+code);setQueue(q)}fin('undoq','UNDO SAVED','No internet. The undo will be sent automatically.')})}
function flush(){var q=queue();if(!q.length||testMode())return;var c=q[0],u=c.charAt(0)==='!',code=u?c.slice(1):c;
  (u?sendUndo(code):send(parse(code))).then(function(j){if(!(j&&j.ok))return;setQueue(queue().filter(function(x){return x!==c}));
    var L=slog();for(var k=0;k<L.length;k++)if(L[k].c===code&&L[k].s===(u?'undoq':'queued')){L[k].s=u?'undone':'ok';setLog(L);break}
    flush()}).catch(function(){})}
function stop(){clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('cam').hidden=true;busy=false}
function hit(t){if(busy)return;busy=true;stop();handle(t)}
/* decoders: the phone's own BarcodeDetector (Android Chrome) + zxing-cpp (wasm) for iPhone and as a second try */
var OPT={formats:['QRCode'],tryHarder:true,maxNumberOfSymbols:1};
function zw(){return !!(window.ZXingWASM&&ZXingWASM.readBarcodes)}
function mkBD(){try{return 'BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null}catch(e){return null}}
function zwData(d){return ZXingWASM.readBarcodes(d,OPT).then(function(r){return r&&r.length&&r[0].text?r[0].text:null})}
/* if the wasm reader cannot load (blocked or offline), jsQR (plain JS) takes over */
var zwBad=false;
function jq(d){try{if(window.jsQR){var r=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});return r&&r.data||null}}catch(e){}return null}
function hasSoft(){return (zw()&&!zwBad)||!!window.jsQR}
function soft(d){if(zw()&&!zwBad)return zwData(d).catch(function(){zwBad=true;return jq(d)});return Promise.resolve(jq(d))}
function grab(src,w,h,max){var k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas'),x;c.width=Math.round(w*k);c.height=Math.round(h*k);
  x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,c.width,c.height);return {c:c,d:x.getImageData(0,0,c.width,c.height)}}
/* live camera needs the https link opened in Chrome/Safari; otherwise the phone camera app takes a photo */
function canLive(){return !liveFail&&!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)}
function start(){home();busy=false;
  if(!canLive()){if(liveFail){photo();return}askPhoto({name:window.isSecureContext?'NoCamera':'NotHttps'});return}
  $('cam').hidden=false;var v=$('v'),req;
  try{req=navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}catch(e){liveFail=true;stop();askPhoto(e);return}
  req.then(function(s){stream=s;v.srcObject=s;
    try{var tr=s.getVideoTracks()[0],cp=tr.getCapabilities&&tr.getCapabilities();if(cp&&cp.focusMode&&cp.focusMode.indexOf('continuous')>=0)tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){})}catch(e){}
    return v.play()}).then(function(){var bd=mkBD(),n=0,fly=false;
    if(!bd&&!hasSoft()){liveFail=true;stop();askPhoto({name:'NoScanner'});return}
    timer=setInterval(function(){if(busy||!stream||!v.videoWidth||fly)return;fly=true;n++;
      var job=bd&&(!hasSoft()||n%3)?bd.detect(v).then(function(r){return r&&r.length?r[0].rawValue:null}):soft(grab(v,v.videoWidth,v.videoHeight,zw()&&!zwBad?1920:1280).d);
      job.then(function(t){fly=false;if(t)hit(t)},function(){fly=false})},180)
  }).catch(function(e){liveFail=true;stop();askPhoto(e)})}
function askPhoto(e){var n=(e&&e.name)||'',r=$('res');clearTimeout(back);r.className='full bad';r.hidden=false;
  r.innerHTML='<div class="big">CAMERA BLOCKED</div><div class="msg"></div><button id="usepic" class="pbtn" type="button">TAKE PHOTO</button><div class="tap">Tap outside to go back</div>';
  r.querySelector('.msg').textContent=(n==='NotAllowedError'?'The camera is not allowed for this page. Allow it in the browser settings, or':n==='NotHttps'?'Live scanning works only from the scanner link in Chrome or Safari. For now,':'The live camera does not work here. Please')+' take a photo of the QR.'+(n?' ('+n+')':'')}
function photo(){var f=$('pic');f.value='';f.click()}
function loadImg(f){if(window.createImageBitmap)return createImageBitmap(f);return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i)};i.onerror=no;i.src=URL.createObjectURL(f)})}
function readPic(f){return loadImg(f).then(function(img){var W=img.width,H=img.height,sizes=[1600,2600,1000],i=0,bd=mkBD();
  function next(){if(i>=sizes.length)return Promise.reject(new Error('none'));var g=grab(img,W,H,sizes[i++]);
    var a=bd?bd.detect(g.c).then(function(r){return r&&r.length?r[0].rawValue:null},function(){return null}):Promise.resolve(null);
    return a.then(function(t){return t||soft(g.d)}).then(function(t){return t||next()},function(){return next()})}
  return next()})}
$('pic').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;show('wait','Reading…',null,'');
  readPic(f).then(function(t){handle(t)},function(){beep(false);show('bad','NO CODE',null,'Could not read the QR. Take the photo closer, flat and sharp.')})});
$('scan').addEventListener('click',start);
$('close').addEventListener('click',stop);
$('res').addEventListener('click',function(ev){var t=ev.target&&ev.target.closest?ev.target.closest('button'):null,id=t&&t.id;
  if(id==='usepic'){photo();return}
  if(id==='undo'||id==='yes'){doUndo(t.getAttribute('data-c'));return}
  if(id==='no'){home();return}
  var r=$('res');if(!r.classList.contains('wait')&&!r.classList.contains('ask'))home()});
$('tlog').addEventListener('click',function(ev){var t=ev.target&&ev.target.closest?ev.target.closest('button.ub'):null;if(t)askUndo(t.getAttribute('data-c'))});
window.addEventListener('online',flush);
count(0);setQueue(queue());flush();
if(testMode())$('mode').hidden=false;
showLog();
/* load the reader early so the first scan is fast */
try{if(window.ZXingWASM)ZXingWASM.prepareZXingModule({fireImmediately:true}).catch(function(){})}catch(e){}
/* a task link opened from the normal camera: ?c=301287151.P1 */
if(gas()&&google.script.url){google.script.url.getLocation(function(l){var c=l&&l.parameter&&l.parameter.c;if(c)handle(c)})}
else{var q=new URLSearchParams(location.search).get('c');if(q){history.replaceState(null,'',location.pathname);handle(q)}}
})();
</script>
</body>
</html>
