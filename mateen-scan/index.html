<html lang="en">
<head>

<title>MATEEN SCAN</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* MATEEN SCAN · the look the owner approved on 25/11/2026 (walnut band with today's count, two wide buttons, green check).
   No login. «Scan operations» works; «Scan BOLISA» is a separate scanner, not built yet (soon).
   Numbers use the UI font (no dotted zero). Light only. */
:root{--walnut:#6E4B34;--sand:#D8C7AE;--ivory:#F6F1E8;--ink:#2B2520;--mute:#7D7266;--line:#E6DED2;--ok:#0F7B3D;--warn:#B7801A;--bad:#A33D28;
  --f:'Readex Pro','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ivory);color:var(--ink);font-family:var(--f);font-variant-numeric:tabular-nums;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--walnut);outline-offset:2px}
[hidden]{display:none!important}
.ar{direction:rtl;unicode-bidi:isolate}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;direction:ltr}
.view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
/* home */
.band{flex:none;color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 62px;border-radius:0 0 30px 30px;background:radial-gradient(120% 100% at 15% 0%,rgba(255,255,255,.16),rgba(255,255,255,0) 62%),var(--walnut)}
.brow{display:flex;align-items:center;gap:10px}
.logo{display:block;width:40px;height:40px;border-radius:11px;flex:none}
.bt b{display:block;font-size:17px;letter-spacing:.05em;line-height:1.2}
.bt small{display:block;font-size:12px;color:var(--sand)}
.bnum{text-align:center;margin-top:8px;line-height:1}
.bnum b{display:block;font-size:56px}
.bnum small{display:block;margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--sand)}
.tiles{position:relative;z-index:1;flex:1 0 auto;max-height:380px;margin-top:-46px;padding:0 14px 14px;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;align-items:center;gap:12px;min-width:0;width:100%;min-height:132px;border:2px solid transparent;border-radius:24px;padding:14px;text-align:left;background:#fff}
.tile.on{box-shadow:0 10px 26px rgba(43,37,32,.16)}
.tile.on:active{transform:scale(.985)}
.tile.off{border:2px dashed #E3A9A2;cursor:default}
.ti{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;flex:none}
.ti svg{width:46px;height:46px}
.tile.on .ti{background:var(--walnut);color:#fff}
.tile.off .ti{background:#FBE9E7;color:#C62828}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:20px;line-height:1.15}
.tt em{display:block;font-style:normal;font-size:17px;font-weight:600;margin-top:3px;color:var(--walnut);text-align:left}
.tile.off .tt b{color:#C62828}
.tile.off .tt em{color:var(--mute)}
.tgo{width:46px;height:46px;border-radius:50%;background:var(--walnut);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.soon{position:absolute;top:12px;right:12px;background:var(--sand);color:var(--walnut);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap}
#inst{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 14px 12px;min-height:50px;padding:10px 14px;border-radius:16px;background:var(--sand);color:var(--walnut);font-size:15px;font-weight:700}
#ios{flex:none;margin:0 14px 12px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--walnut);font-size:13.5px;line-height:1.6;text-align:center;direction:rtl}
#mode{flex:none;align-self:center;margin:0 14px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;background:#F2C14E;color:#3B2719;border-radius:8px;padding:3px 10px}
#queue{flex:none;margin:0 14px;font-size:13px;font-weight:600;color:var(--warn);text-align:center}
#queue:not(:empty){margin-bottom:10px}
/* last scan card (home + scanner) */
.lastc{flex:none;background:#fff;color:var(--ink);border-radius:18px;padding:12px 14px}
.home .lastc{margin:auto 14px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.lastc small{font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.lrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.lrow b{display:block}
.meta{color:var(--mute);font-size:12px}
/* records on the home (owner 25/11/2026: «للعمال كمان… يقدر يلغي التحضير… وتحت سجلات كلها»): every scan of this phone, newest first, each with its own undo */
.logc{flex:none;margin:auto 14px calc(16px + env(safe-area-inset-bottom,0px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px 6px}
.logc>small{display:block;font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.04em;margin-bottom:2px}
.logc .lrow{margin:0;padding:8px 0;border-top:1px solid var(--line)}
.logc small+.lrow{border-top:0}
.logc .lw{flex:1;min-width:0}
.logc .lw b{overflow-wrap:anywhere}
.logc .off .lw{opacity:.55}
.logc .off b{text-decoration:line-through}
.chk.x{background:var(--mute);box-shadow:none}
.ub{flex:none;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--bad);font-size:12.5px;font-weight:700;white-space:nowrap}
/* the approved check: green disc · white ring · white tick */
.chk{border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.chk.s{width:28px;height:28px;font-size:13px;box-shadow:inset 0 0 0 2px var(--ok),inset 0 0 0 3.5px #fff}
.chk.b{width:96px;height:96px;font-size:48px;box-shadow:inset 0 0 0 7px var(--ok),inset 0 0 0 11px #fff}
/* scanner: the camera fills the screen · every code it can read gets a box · the worker taps the one he wants */
.full{position:fixed;inset:0;z-index:5}
#cam{background:#000;color:#fff;overflow:hidden;touch-action:manipulation;direction:ltr}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camh{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 28px;font-weight:700;font-size:15px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none}
#close{pointer-events:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:22px;flex:none}
.camb{position:absolute;left:0;right:0;bottom:0;padding:44px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.66));pointer-events:none}
.tip{text-align:center;font-size:15px;font-weight:600;margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.tip.no{color:#FFD9A0}
#cam .lastc{margin:0}
.ring{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border:3px solid #fff;border-radius:50%;pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(1.4);opacity:1}to{transform:scale(.7);opacity:0}}
/* result screens */
#res{display:flex;flex-direction:column;background:var(--ivory);color:var(--ink);direction:ltr}
.resb{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;text-align:center}
#res h2{margin:0;font-size:22px;color:var(--ok)}
#res.warn h2{color:var(--warn)}
#res.bad h2{color:var(--bad)}
#res.wait h2{color:var(--walnut)}
.rc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;width:100%;max-width:420px}
.rc .no{font-size:21px;font-weight:700;overflow-wrap:anywhere}
.rc .en{color:var(--mute)}
.rc .arn{color:var(--walnut);font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.nx{font-size:11.5px;margin-top:6px;color:var(--mute)}
.msg{margin:0;color:var(--mute);max-width:340px}
.acts{flex:none;width:100%;max-width:480px;margin:0 auto;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:99px;font-weight:700;font-size:15px;padding:0 14px}
.btn.pri{background:var(--walnut);color:#fff}
.btn.out{background:#fff;border:1px solid var(--line);color:var(--bad)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--walnut)}
.big{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:46px;font-weight:700;color:#fff}
.big.warn{background:var(--warn)}
.big.bad{background:var(--bad)}
.big.wait{background:var(--walnut)}
.chk.x{background:var(--mute);box-shadow:none}
.chk.e{background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
/* admin button on the home + the owner page behind the lock (owner 25/11/2026): all orders like the noon orders page, mark a task done or undo it, all records, change the password */
.bt{flex:1;min-width:0}
.abtn{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700}
.abtn svg{width:16px;height:16px}
#adm{background:var(--ivory);color:var(--ink);direction:ltr;overflow-y:auto;-webkit-overflow-scrolling:touch}
.adm{max-width:520px;margin:0 auto;padding:0 12px calc(70px + env(safe-area-inset-bottom,0px))}
.ah{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:0 -12px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--walnut);color:#fff}
.ah .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);font-size:20px;flex:none;display:grid;place-items:center}
.ah .ic svg{width:20px;height:20px}
.at{flex:1;min-width:0}
.at b{display:block;font-size:16px;line-height:1.25}
.at small{display:block;font-size:11.5px;color:var(--sand)}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px;margin:12px 0 10px}
.tabs button{flex:1;min-height:40px;border-radius:99px;font-weight:700;font-size:13.5px;color:var(--mute)}
.tabs button.on{background:var(--walnut);color:#fff}
#aq{display:block;width:100%;min-height:46px;border:1px solid var(--line);border-radius:99px;background:#fff;padding:0 18px;font:inherit;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.chips button.on{background:var(--walnut);border-color:var(--walnut);color:#fff}
.ord{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.oh{display:block;width:100%;text-align:left;padding:12px 14px}
.oh .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oh .r1 b{font-size:16px}
.oh .meta,.oh .nx,.oh .bar{display:block}
.tg{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
.tg.run{color:var(--warn)}
.tg.ready{color:var(--ok)}
.tasks{border-top:1px solid var(--line);padding:2px 14px 6px}
.tk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tasks .tk:first-child{border-top:0}
.tn{flex:1;min-width:0}
.tn b{display:block;font-size:13.5px;overflow-wrap:anywhere}
.tn small{display:block;font-size:12px;color:var(--mute)}
.mb{flex:none;min-height:40px;padding:6px 12px;border-radius:99px;background:var(--walnut);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.mb:disabled,.ub:disabled{opacity:.5}
.alist>.tk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.alist>.tk.off .tn{opacity:.55}
.alist>.tk.off b{text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;max-width:88%;background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-size:13px;font-weight:600;text-align:center}
.lock{min-height:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 20px;text-align:center}
.lock h2{margin:0;font-size:22px;color:var(--walnut)}
.lock form{width:100%;display:flex;flex-direction:column;gap:10px}
.lock input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:99px;background:#fff;padding:0 20px;font:inherit;font-size:16px;color:var(--ink);text-align:center}
.lock .err{margin:0;min-height:20px;color:var(--bad);font-weight:600}
.lock .big svg{width:44px;height:44px}
@media (prefers-reduced-motion:no-preference){.chk.b{animation:pop .35s ease}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="view home" id="home">
  <div class="band"><div class="brow"><img class="logo" src="app-logo-128.png" alt=""><span class="bt"><b>MATEEN SCAN</b><small id="cyc">MATEEN FACTORY · Cycle NOV.08</small></span><button type="button" class="abtn" id="admb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Admin</button></div><div class="bnum"><b id="cnt">0</b><small>DONE TODAY</small></div></div>

</div>
<section id="cam" class="full" hidden><video id="v" playsinline muted></video><canvas id="ov"></canvas>
  <div class="camh"><button id="close" type="button" aria-label="Back">←</button><span>Scan operations · <span class="ar">مسح العمليات</span></span></div>

</section>
<section id="adm" class="full" hidden></section>
<section id="res" class="full" hidden></section>
<input type="file" id="pic" accept="image/*" capture="environment" hidden>

  P6:['Tab edge banding','شريط السطح'],PA:['Base edge banding','شريط القاعدة'],P7:['Body edge banding','شريط الهيكل'],CL:['Long cladding','التكسيات الطويلة'],IK:['IKEA design','تصميم إيكيا'],LD:['LED in top','تركيب LED'],AC:['Accessories','تعبئة الإكسسوارات'],

  +'<div class="tabs"><button type="button" data-a="tab" data-v="orders"'+(AD.tab==='orders'?' class="on"':'')+'>Orders · <span class="ar">الطلبات</span></button><button type="button" data-a="tab" data-v="rec"'+(AD.tab!=='orders'?' class="on"':'')+'>Records · <span class="ar">السجلات</span></button></div><div id="abody"></div></div><div class="toast" id="toast" hidden></div>';
  admFill(true)}
function admFill(full){var b=$('abody'),s=$('asub');if(!b||!AD.on)return;
  if(s)s.textContent='Cycle NOV.08 · '+ORD.length+' orders'+(AD.at?' · updated '+hhmm(AD.at):AD.loading?' · loading…':'');
  if(AD.tab!=='orders'){b.innerHTML='<div class="alist" id="alist">'+recList()+'</div>';return}
  if(full||!$('aq'))b.innerHTML='<input id="aq" type="search" inputmode="numeric" autocomplete="off" placeholder="Search order number" aria-label="Search order number" value="'+esc(AD.q)+'"><div class="chips" id="achips"></div><div class="alist" id="alist"></div>';
  var q=AD.q.replace(/\s+/g,'').toUpperCase(),cnt={all:ORD.length,run:0,ready:0,idle:0},L=[];
  ORD.forEach(function(o){var D=AD.map[o.no]||{},k=kindOf(o,D);cnt[k]++;if((AD.f==='all'||AD.f===k)&&(!q||o.no.indexOf(q)>=0))L.push(ordCard(o,D,k))});
  $('achips').innerHTML=[['all','All'],['run','In progress'],['ready','Ready'],['idle','Not started']].map(function(c){return '<button type="button" data-a="f" data-v="'+c[0]+'"'+(AD.f===c[0]?' class="on"':'')+'>'+c[1]+' '+cnt[c[0]]+'</button>'}).join('');
  $('alist').innerHTML=L.length?L.join(''):'<p class="meta" style="text-align:center;padding:20px 0">No orders here</p>'}
/* show the change at once, then check with the sheet a moment later */
function admApply(code,undo,dup){var p=parse(code),M=AD.map,R=AD.rows,i;
  if(undo){if(M[p.no])delete M[p.no][p.st];for(i=R.length-1;i>=0;i--)if(R[i].order===p.no&&R[i].stage===p.st&&R[i].status==='done'){R[i].status='undone';break}}
  else{M[p.no]=M[p.no]||{};if(!M[p.no][p.st])M[p.no][p.st]=Date.now();if(!dup)R.push({t:new Date().toISOString(),order:p.no,stage:p.st,status:'done'})}
  if(DONE&&DONE.d){if(undo){if(DONE.d[p.no])delete DONE.d[p.no][p.st]}else{(DONE.d[p.no]=DONE.d[p.no]||{})[p.st]=1}ls('done',JSON.stringify(DONE))}
  clearTimeout(AD.sy);AD.sy=setTimeout(function(){if(AD.on)admLoad()},5000)}
function admDo(code,undo){var p=parse(code);if(!p||AD.busy[code]||testMode()||gas())return;AD.busy[code]=1;admFill();var dev='ADMIN · '+(navigator.userAgent||'').slice(0,50);
  fetch(API,{method:'POST',body:JSON.stringify(undo?{code:code,device:dev,action:'undo'}:{code:code,device:dev})}).then(function(r){return r.json()}).then(function(j){delete AD.busy[code];
    if(!(j&&j.ok)){toast('Not saved ('+(j&&j.err||'error')+')');admFill();return}
    if(undo){var L=slog(),i=active(L,code);if(i>=0&&L[i].s==='ok'){L[i].s='undone';if(new Date(L[i].t).toDateString()===new Date().toDateString())count(-1);ls('scanlog',JSON.stringify(L.slice(0,300)))}}
    admApply(code,undo,j.dup);admFill();toast((undo?'Undone · ':j.dup?'Already done · ':'Done · ')+code)},function(){delete AD.busy[code];admFill();toast('No internet · not saved')})}
$('admb').addEventListener('click',admOpen);
$('adm').addEventListener('click',function(ev){var t=ev.target&&ev.target.closest?ev.target.closest('[data-a]'):null;if(!t||t.disabled)return;var a=t.getAttribute('data-a'),v=t.getAttribute('data-v');
  if(a==='x'){admClose();return}
  if(!AD.on)return;
  if(a==='re'){toast('Updating…');admLoad();return}
  if(a==='pw'){pwView('');return}
  if(a==='bk'){admView();return}
  if(a==='tab'){AD.tab=v;admView();return}
  if(a==='f'){AD.f=v;admFill();return}
  if(a==='open'){AD.open=AD.open===v?null:v;admFill();return}
  if(a==='mk'){admDo(v,false);return}
  if(a==='un'){admDo(v,true);return}});
$('adm').addEventListener('input',function(ev){if(ev.target&&ev.target.id==='aq'){AD.q=ev.target.value;admFill()}});
$('adm').addEventListener('submit',function(ev){ev.preventDefault();var id=ev.target&&ev.target.id;if(id==='lockf')unlock();else if(id==='pwf'&&AD.on)savePw()});
$('scan').addEventListener('click',function(){start()});
$('close').addEventListener('click',function(){fromCam=false;stop()});
$('logc').addEventListener('click',function(ev){var t=ev.target&&ev.target.closest?ev.target.closest('button.ub'):null;if(t)askUndo(t.getAttribute('data-c'))});
$('res').addEventListener('click',function(ev){var t=ev.target&&ev.target.closest?ev.target.closest('button'):null,id=t&&t.id;
  if(id==='usepic'){photo();return}
  if(id==='undo'){doUndo(t.getAttribute('data-c'));return}
  if(id==='next'){start();return}
  if(id==='gohome'){fromCam=false;home();return}});
window.addEventListener('online',function(){flush();pull()});
/* the app went to the background: the camera closes */
document.addEventListener('visibilitychange',function(){if(document.hidden){hidAt=Date.now();if(!$('cam').hidden){fromCam=false;stop()}}
  else if(AD.on&&hidAt&&Date.now()-hidAt>120000)admClose()});   /* the owner page locks itself after 2 minutes in the background */
count(0);setQueue(queue());flush();
if(testMode())$('mode').hidden=false;
showLast();setTip();pull();
/* load the reader early so the first scan is fast */
try{if(window.ZXingWASM)ZXingWASM.prepareZXingModule({fireImmediately:true}).catch(function(){})}catch(e){}
/* a task link opened from the normal camera: ?c=301287151.P1 */
if(gas()&&google.script.url){google.script.url.getLocation(function(l){var c=l&&l.parameter&&l.parameter.c;if(c)handle(c)})}
else{var q=new URLSearchParams(location.search).get('c');if(q){history.replaceState(null,'',location.pathname);handle(q)}}
})();
</script>
<script>
/* installable app (owner 25/11/2026): icon with the Mateen mark on the phone, opens straight into scanning */
(function(){var b=document.getElementById('inst'),ios=document.getElementById('ios'),ev=null;
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;if(!standalone)b.hidden=false});
  b.addEventListener('click',function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){b.hidden=true;ev=null})});
  window.addEventListener('appinstalled',function(){b.hidden=true});
  if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent))ios.hidden=false;})();
</script>
